# AI Benchmark — Analysis Pipeline Graph
# Transforms collection data through 13 analysis services into intelligence
# products for the web UI, REST API, and CLI.

[graph]
name = "Analysis Pipeline"
classification = "analysis"
description = "Transforms EventRecord, ClaimRecord, CrossReference, and research tables into intelligence products"
table_count = 5
service_count = 13
product_count = 13
consumer_count = 6

# ════════════════════════════════════════════
#  Control Nodes
# ════════════════════════════════════════════

[[nodes]]
id = "START"
type = "control"
label = "Analysis Start"

[[nodes]]
id = "END"
type = "control"
label = "Analysis End"

# ════════════════════════════════════════════
#  Input Table Nodes (produced by Pipeline 1)
# ════════════════════════════════════════════

[[nodes]]
id = "tbl.event_records"
type = "table"
label = "EventRecord"
db_table = "event_records"
pipeline = "collection"
description = "Model releases, benchmark results, pricing changes, announcements"

[[nodes]]
id = "tbl.claim_records"
type = "table"
label = "ClaimRecord"
db_table = "claim_records"
pipeline = "collection"
description = "Per-source fact claims with confidence tier and confirmation status"

[[nodes]]
id = "tbl.cross_references"
type = "table"
label = "CrossReference"
db_table = "cross_references"
pipeline = "collection"
description = "Inter-event links: confirms, supplements, conflicts_with, cites"

[[nodes]]
id = "tbl.candidate_papers"
type = "table"
label = "CandidatePaper"
db_table = "candidate_papers"
pipeline = "collection"
description = "Research paper candidates from arXiv, HF Papers"

[[nodes]]
id = "tbl.enriched_papers"
type = "table"
label = "EnrichedPaper"
db_table = "enriched_papers"
pipeline = "collection"
description = "Enriched research metadata with citations, tags, venue"

# ════════════════════════════════════════════
#  Tier 1 Service Nodes — Base Services
#  (read directly from DB tables)
# ════════════════════════════════════════════

[[nodes]]
id = "svc.model_lifecycle"
type = "service"
label = "Model Lifecycle"
tier = 1
module = "analysis.services.model_lifecycle"
service_role = "Model profiles, timelines, comparisons, status inference"

[[nodes]]
id = "svc.benchmark_trends"
type = "service"
label = "Benchmark Trends"
tier = 1
module = "analysis.services.benchmark_trends"
service_role = "Leaderboards, score extraction, time series, benchmark listing"

[[nodes]]
id = "svc.competitive_intel"
type = "service"
label = "Competitive Intel"
tier = 1
module = "analysis.services.competitive_intel"
service_role = "Cross-org activity timeline, iso-week cluster detection"

[[nodes]]
id = "svc.research_pulse"
type = "service"
label = "Research Pulse"
tier = 1
module = "analysis.services.research_pulse"
service_role = "Citation leaders, research trends, paper-to-product matching"

[[nodes]]
id = "svc.anomaly_detector"
type = "service"
label = "Anomaly Detector"
tier = 1
module = "analysis.services.anomaly_detector"
service_role = "6-rule automated insight flagging with idempotent persistence"

[[nodes]]
id = "svc.verification"
type = "service"
label = "Verification"
tier = 1
module = "analysis.services.verification"
service_role = "Claim confirmation depth, confidence tier distribution, cross-ref validation"

# ════════════════════════════════════════════
#  Tier 2 Service Nodes — Composed Services
#  (call Tier 1 services)
# ════════════════════════════════════════════

[[nodes]]
id = "svc.capability"
type = "service"
label = "Capability"
tier = 2
module = "analysis.services.capability"
service_role = "Cross-benchmark percentile profiles, composite scoring"

[[nodes]]
id = "svc.evolution"
type = "service"
label = "Evolution"
tier = 2
module = "analysis.services.evolution"
service_role = "Rate-of-improvement, frontier progression, saturation detection"

[[nodes]]
id = "svc.spotlight"
type = "service"
label = "Spotlight"
tier = 2
module = "analysis.services.spotlight"
service_role = "New model identification ranked by benchmark debut strength"

[[nodes]]
id = "svc.landscape"
type = "service"
label = "Landscape"
tier = 2
module = "analysis.services.landscape"
service_role = "Org-level competitive synthesis with benchmark and pricing context"

[[nodes]]
id = "svc.correlation"
type = "service"
label = "Correlation"
tier = 2
module = "analysis.services.correlation"
service_role = "Spearman rank correlation between benchmark variants, cluster detection"

[[nodes]]
id = "svc.research_pipeline"
type = "service"
label = "Research Pipeline"
tier = 2
module = "analysis.services.research_pipeline"
service_role = "Citation velocity, split-window topic trends, predictive signals"

# ════════════════════════════════════════════
#  Tier 3 Service Node — Orchestrator
# ════════════════════════════════════════════

[[nodes]]
id = "svc.digest"
type = "service"
label = "Digest"
tier = 3
module = "analysis.services.digest"
service_role = "Periodic intelligence summary orchestrating all services"

