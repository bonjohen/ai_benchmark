<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Publication{% endblock %} — AI Benchmark</title>
    <link rel="stylesheet" href="/publication/static/css/publication.css">
    {% block head %}{% endblock %}
</head>
<body>
<nav class="pub-nav">
    <div class="pub-brand">AI Benchmark Daily</div>
    <ul class="pub-nav-links">
        <li><a href="/publication/" {% if active_page == "latest" %}class="active"{% endif %}>Latest</a></li>
        <li><a href="/publication/archive" {% if active_page == "archive" %}class="active"{% endif %}>Archive</a></li>
        <li><a href="/publication/admin" {% if active_page == "admin" %}class="active"{% endif %}>Editor</a></li>
        <li><a href="/eval/">Eval Dashboard</a></li>
    </ul>
</nav>
<main class="pub-main">
    {% block content %}{% endblock %}
</main>
<footer class="pub-footer">
    <p>AI Benchmark Intelligence Pipeline</p>
</footer>
<script src="/publication/static/js/publication.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
