relationship = "calls"

[[edges]]
source = "svc.model_lifecycle"
target = "svc.landscape"
relationship = "calls"

[[edges]]
source = "svc.benchmark_trends"
target = "svc.landscape"
relationship = "calls"

# correlation calls benchmark_trends (extract_benchmark_score)
[[edges]]
source = "svc.benchmark_trends"
target = "svc.correlation"
relationship = "calls"

# research_pipeline calls research_pulse (get_citation_leaders, detect_paper_to_product)
[[edges]]
source = "svc.research_pulse"
target = "svc.research_pipeline"
relationship = "calls"

