label = "Research Trends & Citations"
dataclass = "ResearchTrends, PaperCitationEntry"

[[nodes]]
id = "out.insight_data"
type = "product"
label = "Analysis Insights"
dataclass = "AnalysisInsight"

[[nodes]]
id = "out.verification_data"
type = "product"
label = "Verification Reports"
dataclass = "VerificationReport"

[[nodes]]
id = "out.capability_data"
type = "product"
label = "Capability Profiles"
dataclass = "CapabilityProfile"

[[nodes]]
id = "out.evolution_data"
type = "product"
label = "Evolution Summaries"
dataclass = "EvolutionSummary"

[[nodes]]
id = "out.spotlight_data"
