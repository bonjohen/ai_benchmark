relationship = "feeds"

# benchmark_trends reads events (benchmark_variant + raw_content)
[[edges]]
source = "tbl.event_records"
target = "svc.benchmark_trends"
relationship = "feeds"

# competitive_intel reads events (organization + event_type)
[[edges]]
source = "tbl.event_records"
target = "svc.competitive_intel"
relationship = "feeds"

# research_pulse reads papers and events (paper-to-product matching)
[[edges]]
source = "tbl.candidate_papers"
target = "svc.research_pulse"
relationship = "feeds"

[[edges]]
source = "tbl.enriched_papers"
target = "svc.research_pulse"
relationship = "feeds"

[[edges]]
source = "tbl.event_records"
target = "svc.research_pulse"
relationship = "feeds"

# anomaly_detector reads events and claims
[[edges]]
source = "tbl.event_records"
target = "svc.anomaly_detector"
relationship = "feeds"

[[edges]]
source = "tbl.claim_records"
target = "svc.anomaly_detector"
relationship = "feeds"

# verification reads events, claims, and cross-references
[[edges]]
source = "tbl.event_records"
target = "svc.verification"
relationship = "feeds"

[[edges]]
source = "tbl.claim_records"
target = "svc.verification"
relationship = "feeds"

[[edges]]
source = "tbl.cross_references"
target = "svc.verification"
relationship = "feeds"

