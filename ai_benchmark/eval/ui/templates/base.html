<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eval{% endblock %} — AI Benchmark</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-brand">AI Bench Eval</div>
    <ul class="sidebar-nav">
        <li><a href="/eval/" {% if active_page == "dashboard" %}class="active"{% endif %}>
            <span class="nav-icon">&#9632;</span> <span>Dashboard</span>
        </a></li>
        <li><a href="/eval/evaluations" {% if active_page == "evaluations" %}class="active"{% endif %}>
            <span class="nav-icon">&#9670;</span> <span>Evaluations</span>
        </a></li>
        <li><a href="/eval/datasets" {% if active_page == "datasets" %}class="active"{% endif %}>
            <span class="nav-icon">&#9776;</span> <span>Datasets</span>
        </a></li>
        <li><a href="/eval/scorers" {% if active_page == "scorers" %}class="active"{% endif %}>
            <span class="nav-icon">&#10003;</span> <span>Scorers</span>
        </a></li>
        <li><a href="/eval/targets" {% if active_page == "targets" %}class="active"{% endif %}>
            <span class="nav-icon">&#9881;</span> <span>Targets</span>
        </a></li>
        <li><a href="/eval/machines" {% if active_page == "machines" %}class="active"{% endif %}>
            <span class="nav-icon">&#9109;</span> <span>Machines</span>
        </a></li>
        <li><a href="/eval/runs" {% if active_page == "runs" %}class="active"{% endif %}>
            <span class="nav-icon">&#9654;</span> <span>Runs</span>
        </a></li>
        <li><a href="/eval/reports" {% if active_page == "reports" %}class="active"{% endif %}>
            <span class="nav-icon">&#9733;</span> <span>Reports</span>
        </a></li>
    </ul>
</nav>

<main class="main-content">
    {% block flash %}{% endblock %}
    {% block content %}{% endblock %}
</main>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
