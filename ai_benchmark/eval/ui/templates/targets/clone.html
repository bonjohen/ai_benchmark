{% extends "base.html" %}
{% set active_page = "targets" %}
{% block title %}Clone {{ target.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Clone Target: {{ target.name }}</h1>
</div>

<div class="card">
    <form method="post" action="/eval/targets/{{ target.id }}/clone">
        <div class="form-group">
            <label for="new_name">New Name</label>
            <input type="text" name="new_name" id="new_name" class="form-control"
                   value="{{ target.name }} (copy)" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Source Model</label>
                <p class="text-mono">{{ target.model_name }}</p>
            </div>
            <div class="form-group">
                <label>Provider</label>
                <p>{{ target.provider }}</p>
            </div>
            <div class="form-group">
                <label>Runtime</label>
                <p>{{ target.runtime_backend or "—" }}</p>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Clone</button>
        <a href="/eval/targets/{{ target.id }}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
