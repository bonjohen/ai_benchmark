[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-benchmark"
version = "0.1.0"
description = "AI model and benchmark intelligence pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx[http2,brotli]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "click>=8.1",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.8",
]
research = [
    "pymupdf>=1.23",
    "semanticscholar>=0.8",
]

[project.scripts]
ai-benchmark = "ai_benchmark.cli:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
