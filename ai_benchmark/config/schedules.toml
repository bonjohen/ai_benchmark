# Source polling schedule configuration
# Maps source organizations to cron expressions
# Format: "minute hour day_of_month month day_of_week"

# Official changelogs/release notes — every 6-12 hours
[[schedules]]
organization = "OpenAI"
cron = "0 */6 * * *"
max_concurrent = 2

