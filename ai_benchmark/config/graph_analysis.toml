# ════════════════════════════════════════════
#  Consumer Nodes — UI Pages, API, CLI
# ════════════════════════════════════════════

[[nodes]]
id = "ui.overview"
type = "consumer"
label = "Intelligence Overview"
consumer_type = "ui_page"
route = "/eval/analysis"

[[nodes]]
id = "ui.models"
type = "consumer"
label = "Models List"
consumer_type = "ui_page"
route = "/eval/analysis/models"

[[nodes]]
id = "ui.model_detail"
type = "consumer"
label = "Model Detail"
consumer_type = "ui_page"
route = "/eval/analysis/models/{slug}"

[[nodes]]
id = "ui.verification"
type = "consumer"
label = "Verification Dashboard"
consumer_type = "ui_page"
route = "/eval/analysis/verification"

[[nodes]]
id = "con.api"
type = "consumer"
label = "REST API"
consumer_type = "api"
route = "/api/analysis/*"
endpoint_count = 18

[[nodes]]
id = "con.cli"
type = "consumer"
label = "CLI Commands"
consumer_type = "cli"
route = "analyze *"
command_count = 16

