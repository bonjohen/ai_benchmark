target = "svc.spotlight"
relationship = "calls"

[[edges]]
source = "svc.benchmark_trends"
target = "svc.spotlight"
relationship = "calls"

# landscape calls competitive_intel + model_lifecycle + benchmark_trends
[[edges]]
